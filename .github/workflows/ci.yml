name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Public values only (GitHub Actions variables). No secret is needed to lint, test or build.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_ORIGIN }}
      NEXT_PUBLIC_WEB_ORIGIN: ${{ vars.NEXT_PUBLIC_WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (no new errors compared with the baseline)
        run: |
          node scripts/lint-report.mjs
          node scripts/lint-summary.mjs test-results/lint.json --baseline docs/superpowers/notes/lint-baseline.json
      - run: pnpm test
      - name: Web build
        run: pnpm build
      - name: Mobile export
        run: pnpm build:mobile
      - name: Export check
        run: pnpm check:export
      - name: Upload the static export (for the native builds)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-export
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-export
          path: out
      - name: Copy the export into the Android project
        run: |
          node scripts/sync-app-version.mjs
          npx cap sync android
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: volleystats-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    needs: checks
    # macos-26 is GitHub's arm64 macOS 26 image; it ships several Xcode 26.x versions (runner-images macos-26-arm64 README).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          if ! xcodebuild -version | grep -q '^Xcode 26'; then
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: mobile-export
          path: out
      - name: Copy the export into the iOS project
        run: |
          node scripts/sync-app-version.mjs
          npx cap sync ios
      - name: Unsigned simulator build
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build -derivedDataPath build
      - name: Privacy manifest is bundled in the app
        run: |
          manifest=$(find build -name PrivacyInfo.xcprivacy -path '*App.app*')
          echo "Found: $manifest"
          test -n "$manifest"
